name: sensitivity

# The gate-sensitivity sweep (45 grid points x 200 seeded replicates) costs
# ~20 runner-minutes, so it runs on releases, weekly, and on demand rather
# than on every push. It regenerates docs/spec/sensitivity.md byte-for-byte
# and fails on any drift, exactly like the per-push rulings check.

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python tools/render_sensitivity.py --replicates 200
      - run: git diff --exit-code docs/
